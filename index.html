    <div id="sinergia-auth-gate" style="position:fixed;inset:0;z-index:99999;background:#0f172a;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:20px;">
      <div style="width:100%;max-width:380px;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.45);padding:32px 28px;">
        <img src="./assets/logo.png" alt="SINERGIA" style="height:70px;width:auto;display:block;margin:0 auto 18px;object-fit:contain;" />
        <h1 style="margin:0 0 4px;text-align:center;font-size:18px;font-weight:800;color:#1c1917;">Acceso al sistema</h1>
        <p style="margin:0 0 22px;text-align:center;font-size:12.5px;color:#78716c;">Historia Clínica — SINERGIAMED</p>
        <div id="sag-loading" style="text-align:center;color:#78716c;font-size:13px;padding:10px 0;">Verificando acceso…</div>
        <form id="sag-form" style="display:none;">
          <label style="display:block;font-size:12px;font-weight:600;color:#44403c;margin-bottom:5px;">Correo electrónico</label>
          <input id="sag-email" type="email" autocomplete="username" required style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #d6d3d1;border-radius:10px;font-size:14px;margin-bottom:14px;outline:none;" />
          <label style="display:block;font-size:12px;font-weight:600;color:#44403c;margin-bottom:5px;">Contraseña</label>
          <input id="sag-pass" type="password" autocomplete="current-password" required style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #d6d3d1;border-radius:10px;font-size:14px;margin-bottom:16px;outline:none;" />
          <button id="sag-btn" type="submit" style="width:100%;padding:11px;border:0;border-radius:10px;background:#0284c7;color:#fff;font-size:14px;font-weight:700;cursor:pointer;">Iniciar sesión</button>
          <p id="sag-error" style="display:none;margin:12px 0 0;text-align:center;font-size:12.5px;color:#dc2626;"></p>
        </form>
      </div>
    </div>
    <script>
      (function () {
        var URL_ = "https://yobhrbxrqupuqygryceb.supabase.co";
        var KEY_ = "sb_publishable_LvoKk-1WDkdwio8iNc4C3g_V2R7qwSo";
        var TABLES = [
          { t: "clinical_records", field: "record_data", key: "sinergiamed_patients_v1",
            map: function (r) { return { id: r.id, hc_number: r.hcNumber || null, patient_name: (r.patient && r.patient.fullName) || null, id_number: (r.patient && r.patient.idNumber) || null, record_data: r }; } },
          { t: "hyperbaric_patients", field: "patient_data", key: "sinergiamed_hyperbaric_patients_v1",
            map: function (r) { return { id: r.id, full_name: r.fullName || null, id_number: r.idNumber || null, phone: r.phone || null, email: r.email || null, patient_data: r }; } },
          { t: "hyperbaric_sessions", field: "session_data", key: "sinergiamed_hyperbaric_sessions_v1",
            map: function (r) { return { id: r.id, patient_id: r.patientId || null, session_num: r.sessionNum || null, session_date: r.date || null, time_in: r.timeIn || null, time_out: r.timeOut || null, session_data: r }; } }
        ];
        var sb = null, badge = null, appStarted = false;

        function readLocal(key) {
          try { var v = JSON.parse(localStorage.getItem(key) || "[]"); return Array.isArray(v) ? v : []; }
          catch (e) { return []; }
        }
        function makeBadge() {
          if (badge) return badge;
          badge = document.createElement("div");
          badge.id = "sinergia-cloud-badge";
          badge.style.cssText = "position:fixed;bottom:12px;right:12px;z-index:99998;background:#1c1917;color:#fff;border-radius:9px;padding:7px 11px;font:600 11.5px system-ui,sans-serif;opacity:.92;max-width:70vw;line-height:1.35;";
          document.body.appendChild(badge);
          return badge;
        }
        function setBadge(text, color) {
          makeBadge();
          badge.textContent = text;
          badge.style.background = color || "#1c1917";
        }
        // Trae de la nube y fusiona en localStorage (la nube manda en conflictos por id)
        function pull() {
          return Promise.all(TABLES.map(function (c) {
            return sb.from(c.t).select(c.field).then(function (res) {
              if (res.error) throw new Error(c.t + ": " + res.error.message);
              var cloud = (res.data || []).map(function (x) { return x[c.field]; })
                .filter(function (x) { return x && x.id != null; });
              var local = readLocal(c.key), byId = {}, nuevos = 0;
              local.forEach(function (x) { if (x && x.id != null) byId[x.id] = x; });
              cloud.forEach(function (x) { if (!byId[x.id]) nuevos++; byId[x.id] = x; });
              var merged = Object.keys(byId).map(function (k) { return byId[k]; });
              localStorage.setItem(c.key, JSON.stringify(merged));
              return { n: cloud.length, nuevos: nuevos };
            });
          }));
        }
        // Sube todo lo local a la nube (red de seguridad; nunca borra)
        function push() {
          return Promise.all(TABLES.map(function (c) {
            var local = readLocal(c.key).filter(function (x) { return x && x.id != null; });
            if (!local.length) return 0;
            var rows = local.map(function (r) {
              try { var m = c.map(r); m.updated_at = new Date().toISOString(); return m; } catch (e) { return null; }
            }).filter(Boolean);
            if (!rows.length) return 0;
            return sb.from(c.t).upsert(rows, { onConflict: "id" }).then(function (res) {
              if (res.error) throw new Error(c.t + ": " + res.error.message);
              return rows.length;
            });
          }));
        }
        function startApp() {
          if (appStarted) return;
          appStarted = true;
          var s = document.createElement("script");
          s.type = "module"; s.crossOrigin = "anonymous";
          s.src = "./assets/index-sinergia-v2.js";
          document.body.appendChild(s);
        }
        function showReload(n) {
          var b = document.getElementById("sinergia-reload");
          if (b) return;
          b = document.createElement("button");
          b.id = "sinergia-reload";
          b.textContent = "↻ " + n + " registro(s) nuevo(s) — Recargar";
          b.style.cssText = "position:fixed;bottom:52px;right:12px;z-index:99999;background:#0284c7;color:#fff;border:0;border-radius:9px;padding:9px 13px;font:700 12px system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);";
          b.onclick = function () { location.reload(); };
          document.body.appendChild(b);
        }
        function loopSync() {
          setInterval(function () {
            push().then(function () { return pull(); }).then(function (res) {
              var total = res.reduce(function (a, x) { return a + x.n; }, 0);
              var nuevos = res.reduce(function (a, x) { return a + x.nuevos; }, 0);
              setBadge("☁ Nube OK · " + total + " en la nube", "#166534");
              if (nuevos > 0) showReload(nuevos);
            }).catch(function (e) {
              setBadge("⚠ Nube: " + e.message, "#b91c1c");
            });
          }, 15000);
        }
        function addLogout() {
          if (document.getElementById("sinergia-logout")) return;
          var lb = document.createElement("button");
          lb.id = "sinergia-logout";
          lb.textContent = "Salir";
          lb.style.cssText = "position:fixed;bottom:12px;left:12px;z-index:99998;background:#1c1917;color:#fff;border:0;border-radius:9px;padding:7px 12px;font:600 11.5px system-ui,sans-serif;cursor:pointer;opacity:.85;";
          lb.onclick = function () { sb.auth.signOut().then(function () { location.reload(); }); };
          document.body.appendChild(lb);
        }
        function enterApp() {
          var gate = document.getElementById("sinergia-auth-gate");
          var loading = document.getElementById("sag-loading");
          if (loading) loading.textContent = "Cargando datos de la nube…";
          // 1) PRIMERO traer la nube, 2) LUEGO arrancar la app (sin carreras)
          pull().then(function (res) {
            var total = res.reduce(function (a, x) { return a + x.n; }, 0);
            if (gate && gate.parentNode) gate.parentNode.removeChild(gate);
            startApp(); addLogout();
            setBadge("☁ Nube OK · " + total + " en la nube", "#166534");
            loopSync();
          }).catch(function (e) {
            if (gate && gate.parentNode) gate.parentNode.removeChild(gate);
            startApp(); addLogout();
            setBadge("⚠ Nube: " + e.message, "#b91c1c");
            loopSync();
          });
        }
        function start() {
          if (!window.supabase || !window.supabase.createClient) { setTimeout(start, 50); return; }
          sb = window.supabase.createClient(URL_, KEY_);
          var loading = document.getElementById("sag-loading");
          var form = document.getElementById("sag-form");
          var err = document.getElementById("sag-error");
          var btn = document.getElementById("sag-btn");
          sb.auth.getSession().then(function (r) {
            if (r.data && r.data.session) { enterApp(); }
            else { loading.style.display = "none"; form.style.display = "block"; }
          });
          form.addEventListener("submit", function (e) {
            e.preventDefault();
            err.style.display = "none"; btn.disabled = true; btn.textContent = "Entrando…";
            sb.auth.signInWithPassword({
              email: document.getElementById("sag-email").value.trim(),
              password: document.getElementById("sag-pass").value
            }).then(function (r) {
              if (r.error) {
                err.textContent = r.error.message === "Invalid login credentials" ? "Correo o contraseña incorrectos." : r.error.message;
                err.style.display = "block"; btn.disabled = false; btn.textContent = "Iniciar sesión";
              } else {
                form.style.display = "none";
                loading.style.display = "block";
                enterApp();
              }
            });
          });
        }
        setTimeout(function () {
          if (!window.supabase) {
            var l = document.getElementById("sag-loading");
            if (l) { l.textContent = "No se pudo conectar con la nube. Revisa tu internet y recarga."; l.style.color = "#dc2626"; }
          }
        }, 10000);
        start();
      })();
    </script>
    <div id="root"></div>
  </body>
</html>
